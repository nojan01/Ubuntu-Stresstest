[tool.poetry]
name = "hardwaretest-gui"
version = "0.1.0"
description = "GUI launcher for RAM/CPU/Disk stress tests on Ubuntu"
authors = ["Hardwaretest Maintainers <maintainers@example.com>"]
readme = "README.md"
packages = [{ include = "hardwaretest" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pyside6 = "^6.7"
psutil = "^5.9"
pyyaml = "^6.0"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
