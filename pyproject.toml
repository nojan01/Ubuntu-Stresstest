[tool.poetry]
name = "hardwaretest-gui"
version = "0.2.31"
description = "GUI launcher for RAM/CPU/Disk stress tests on Ubuntu"
authors = ["Norbert Jander <n.jander@posteo.de>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "hardwaretest" }]

[tool.poetry.dependencies]
# Ubuntu 26.04 ships Python 3.14.
python = ">=3.10,<3.15"
pyside6 = "^6.7"
psutil = "^6.0"
pyyaml = "^6.0"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Verhindert, dass pytest die Domaenenklassen TestRunner/TestParameters/
# TestExecutionError als Test-Klassen einsammelt.
python_classes = "Test_*"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "B", "SIM", "RUF"]
ignore = [
    # Deutschsprachige Kommentare/Strings/Docstrings enthalten bewusst
    # Umlaute und typografische Zeichen – kein Fehler.
    "RUF001",
    "RUF002",
    "RUF003",
    # Zeilenlaenge wird ueber line-length geregelt, nicht hart erzwungen.
    "E501",
]
