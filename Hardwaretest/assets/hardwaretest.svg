<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5298"/>
      <stop offset="100%" stop-color="#1e3c72"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bg)" stroke="#4a7fd4" stroke-width="2"/>
  <!-- CPU chip body -->
  <rect x="34" y="34" width="60" height="60" rx="6" ry="6" fill="#1a2a4a" stroke="#6ab0ff" stroke-width="2"/>
  <!-- CPU pins left -->
  <line x1="24" y1="48" x2="34" y2="48" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="58" x2="34" y2="58" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="68" x2="34" y2="68" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="78" x2="34" y2="78" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- CPU pins right -->
  <line x1="94" y1="48" x2="104" y2="48" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="58" x2="104" y2="58" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="68" x2="104" y2="68" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="78" x2="104" y2="78" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- CPU pins top -->
  <line x1="48" y1="24" x2="48" y2="34" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="24" x2="58" y2="34" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="24" x2="68" y2="34" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="24" x2="78" y2="34" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- CPU pins bottom -->
  <line x1="48" y1="94" x2="48" y2="104" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="94" x2="58" y2="104" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="94" x2="68" y2="104" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="94" x2="78" y2="104" stroke="#6ab0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Checkmark inside chip -->
  <polyline points="48,64 58,76 82,48" fill="none" stroke="#44ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
